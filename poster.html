<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>कोल्डीहा · QR पोस्टर</title>
<style>
body{font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#F7E7C3;color:#3a1608;max-width:420px;margin:0 auto;padding:24px;text-align:center}
h1{color:#6B1212}
.box{border:3px solid #6B1212;padding:18px;border-radius:16px;background:#fff}

</style>
</head>
<body>
<div class="box">
  <h1>जय माँ दुर्गा</h1>

  <p>ऐप खोलो</p>
  <img alt="QR" width="220" height="220" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Frchaurasiya1075.github.io%2Fgram-koldiha-durga-puja%2F"/>
</div>
<button class="noprint" onclick="window.print()">प्रिंट</button>
<p class="meta noprint"><a href="./index.html">ऐप पर वापस</a></p>
</body>
</html>
